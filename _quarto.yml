project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "projects/**/*.qmd"

website:
  title: "David Bird"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: projects/index.qmd
        text: Projects
      - href: about.qmd
        text: About
    right:
      - icon: github
        href: https://github.com/daviddbird

format:
  html:
    theme: cosmo
    toc: true
    code-fold: true
    code-tools: true

execute:
  freeze: auto   # re-run code only when a page changes; keeps Netlify builds free of data/runtime needs
